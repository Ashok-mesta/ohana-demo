<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ohana · Create a Beneficiary · click-through demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171f; --ink2:#2f3238; --mute:#6b7280; --faint:#9aa0a6; --line:#e4e6ea; --line2:#eef0f2;
  --bg:#fdfdfd; --panel:#f3f6f8; --navy:#1a162d; --violet:#6b5bcf;
  --green:#10a86a; --green-bg:#e8f6ef; --green-tx:#1f8a52;
  --red:#c93b4b; --red-bg:#fbeaec; --red-tx:#b02a3a;
  --amber:#c0822e; --amber-bg:#fdf5e1; --amber-tx:#9a6a1e;
  --bar:#1a162d; --accent:#6b5bcf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Geist',system-ui,sans-serif;color:var(--ink);background:#0f1014;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
input{outline:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:13px;height:13px}
.ico.lg{width:20px;height:20px}
.ico.fill{fill:currentColor;stroke:none}

/* ===== shell ===== */
#shell{position:absolute;left:50%;top:50%;width:1600px;height:900px;display:flex;flex-direction:column;background:#e9eaee;overflow:hidden;transform:translate(-50%,-50%)}
#prompts{position:absolute;inset:0;pointer-events:none;z-index:9000}
.beacon{position:absolute;border:2px solid var(--violet);border-radius:10px;box-shadow:0 0 0 4px rgba(107,91,207,.22);animation:beacon 1.6s ease-out infinite}
@keyframes beacon{0%{box-shadow:0 0 0 2px rgba(107,91,207,.45)}70%{box-shadow:0 0 0 14px rgba(107,91,207,0)}100%{box-shadow:0 0 0 14px rgba(107,91,207,0)}}
.tip{position:absolute;max-width:380px;background:var(--navy);color:#fff;font:500 13.5px/1.35 'DM Sans',sans-serif;padding:9px 13px;border-radius:10px;box-shadow:0 10px 30px rgba(15,15,22,.3);display:flex;gap:8px;align-items:flex-start;text-wrap:pretty}
.tip .ico{color:#c9c1ff;margin-top:1px}
.tip.below{transform:translate(-50%,0)}.tip.above{transform:translate(-50%,-100%)}
.tip::before{content:'';position:absolute;left:50%;width:12px;height:12px;background:var(--navy);transform:translateX(-50%) rotate(45deg)}
.tip.below::before{top:-5px}.tip.above::before{bottom:-5px}
#presenter{background:var(--bar);color:#fff;padding:10px 16px;display:flex;flex-direction:column;gap:6px;flex:none;font-family:'DM Sans',sans-serif}
#presenter .row{display:flex;align-items:center;gap:12px}
#presenter .brand{font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.7}
#presenter .pill{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px;font-size:12.5px}
#presenter .pill.actor{background:var(--accent);font-weight:600}
#presenter .title{font-size:15px;font-weight:600}
#presenter .hint{font-size:13.5px;opacity:.85;flex:1;text-wrap:pretty}
#presenter .sp{flex:1}
#presenter .btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 12px;font:500 13px 'DM Sans',sans-serif;cursor:pointer}
#presenter .btn.primary{background:#fff;color:var(--bar);border:0;padding:6px 14px;font-weight:600}
#presenter .dots{display:flex;gap:4px;flex:none}
#presenter .dots span{width:18px;height:6px;border-radius:3px;cursor:pointer;background:rgba(255,255,255,.18)}
#presenter .dots span.past{background:rgba(255,255,255,.55)}
#presenter .dots span.cur{background:#fff}
#presenter .subs{gap:0;flex-wrap:wrap;row-gap:4px;margin-top:2px}
#presenter .sub{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.55;padding:2px 8px 2px 2px;border-radius:999px}
#presenter .sub i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);font:600 10px/16px 'DM Sans',sans-serif;text-align:center;font-style:normal}
#presenter .sub.done{opacity:.85}#presenter .sub.done i{background:#5dd39e;color:#0f1014}
#presenter .sub.cur{opacity:1;background:rgba(255,255,255,.12);font-weight:600}#presenter .sub.cur i{background:#fff;color:var(--bar)}
#presenter .sep{width:14px;height:1px;background:rgba(255,255,255,.3);margin:0 4px}
#stage{flex:1;min-height:0;display:flex;padding:12px}
#app{flex:1;min-width:0;display:flex;background:var(--bg);border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px var(--accent),0 0 0 8px color-mix(in srgb,var(--accent) 18%,transparent),0 1px 3px rgba(0,0,0,.08);position:relative}

/* ===== app chrome ===== */
.side{width:232px;flex:none;background:#fff;border-right:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.side .logo{padding:18px 20px 10px;display:flex;align-items:center}
.side .logo svg{height:30px;width:auto;color:var(--ink)}
.side .sec{padding:12px 20px 4px;font-size:10.5px;color:var(--faint)}
.side .nav{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--ink2);cursor:pointer;position:relative}
.side .nav .ico{color:#4b4f57}
.side .nav:hover{background:#f7f8fa}
.side .nav.on{background:var(--panel);font-weight:600;color:var(--ink)}
.side .nav.on::before{content:'';position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--violet)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:50px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line2);font-size:13px}
.top .crumb{color:var(--mute)}
.top .crumb b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.top .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mute);font-size:12.5px;background:#fff}
.top .search kbd{font:11px 'Geist Mono',monospace;background:#f1f2f4;border-radius:4px;padding:1px 5px;color:var(--faint)}
.top .acct{display:flex;align-items:center;gap:10px}
.top .acct .t{text-align:right;line-height:1.15}
.top .acct .t b{display:block;font-size:12.5px;font-weight:600}
.top .acct .t span{font-size:10.5px;color:var(--mute)}
.top .acct .av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.top .acct .ico{color:var(--mute)}
.content{flex:1;min-height:0;overflow:auto;padding:22px 26px 28px;scroll-behavior:smooth}
.page-h{display:flex;align-items:flex-start;gap:16px}
.page-h .sp{flex:1}
.kicker{font-size:10.5px;color:var(--faint);margin-bottom:4px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--mute);font-size:13px;margin-top:6px;line-height:1.5;max-width:900px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.1}
.btn:hover{background:#f7f8fa}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.dark:hover{background:#231f3e}
.btn.dark[disabled]{background:#9a9ba6;border-color:#9a9ba6;cursor:default}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:transparent;color:var(--ink2);padding:6px 8px}
.btn .ico{width:15px;height:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;line-height:1.3}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.g{background:var(--green-bg);color:var(--green-tx)}
.chip.r{background:var(--red-bg);color:var(--red-tx)}
.chip.a{background:var(--amber-bg);color:var(--amber-tx)}

/* ===== list ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line2)}
.tabs div{padding:12px 12px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs div.on{font-weight:600;border-bottom-color:var(--ink);color:var(--ink)}
.filters{display:flex;align-items:center;gap:8px;padding:12px 14px}
.filters .f{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.filters .sp{flex:1}
.filters .sel{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;display:flex;gap:28px;align-items:center;cursor:pointer}
.statrow{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:11px;color:var(--mute)}
.statrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.statrow .sp{flex:1}
.statrow .k{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--mute);text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif}
.statrow .k b{color:var(--green-tx);font-weight:600;margin-left:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-weight:500;font-size:10.5px;color:var(--faint);background:var(--panel);padding:12px 16px}
tbody td{padding:13px 16px;border-top:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
tbody tr.new td{background:#f7f9fb}
tbody tr.new td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
.nm{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
.bi{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.bi.g{background:var(--green-bg);color:var(--green-tx)} .bi.r{background:var(--red-bg);color:var(--red-tx)} .bi.a{background:var(--amber-bg);color:var(--amber-tx)}
.bi .ico{width:14px;height:14px}
.ty{display:flex;align-items:center;gap:6px}
.cc{display:flex;align-items:center;gap:6px}
.cc .cur{color:var(--faint);font-size:11px;font-family:'Geist Mono',monospace}
td.arr{color:var(--faint);text-align:right}

/* ===== create ===== */
.fcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 30px}
.lbl{font-size:13px;font-weight:500;margin-bottom:7px;display:block}
.lbl i{color:var(--red);font-style:normal;margin-left:2px}
.help{font-size:12px;color:var(--mute);line-height:1.45;margin-top:7px}
.choice{display:flex;gap:16px}
.choice .c{flex:1;max-width:420px;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;cursor:pointer;align-items:flex-start}
.choice .c .ico{margin-top:3px;color:var(--ink2)}
.choice .c b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
.choice .c span{font-size:12.5px;color:var(--mute);line-height:1.45}
.choice .c.on{border-color:var(--violet);box-shadow:0 0 0 .5px var(--violet)}
.sel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;background:#fff;cursor:pointer;position:relative}
.sel .ico{color:var(--mute)}
.sel .sp{flex:1}
.sel.dis{background:#f3f4f6;color:var(--mute);cursor:default}
.sel .ph{color:var(--ink)}
.sel.focus{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.dd{position:absolute;left:0;top:calc(100% + 4px);width:560px;max-height:300px;overflow:auto;background:#5c5f66;color:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;padding:4px 0}
.dd div{padding:6px 16px;font-size:13px;display:flex;gap:10px;align-items:center;cursor:pointer}
.dd div:hover{background:#6c7079}
.dd div.on{background:#3f74f0}
.dd div .cd{width:26px;font-family:'Geist Mono',monospace;font-size:12px;opacity:.9}
.dd.light{background:#fff;color:var(--ink);border:1px solid var(--line);width:100%}
.dd.light div:hover{background:#f3f4f6}
.dd.light div.on{background:#eef0ff;color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:70px 20px;text-align:center}
.empty b{display:block;font-size:14px;margin-bottom:8px}
.empty span{font-size:13.5px;color:var(--ink2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;background:#fff}
.inp::placeholder{color:#9ca3af}
.inp:focus{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.inp.dis{background:#f3f4f6;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
.g2 .full{grid-column:1/-1}
.box{border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin:14px 0}
.box h4{margin:0 0 12px;font-size:14px;font-weight:600}
.filechip{display:flex;align-items:center;gap:10px;background:#f3f4f6;border-radius:10px;padding:10px 14px;font-size:13px}
.filechip .t{flex:1;min-width:0}
.filechip .t b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filechip .t span{font-size:11.5px;color:var(--mute)}
.filechip .rm{color:var(--red);font-size:12.5px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:14px;padding:22px 0 10px}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;width:120px}
.stepper .st .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.stepper .st .d::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--ink)}
.stepper .st.off{color:var(--mute);font-weight:400}
.stepper .st.off .d{border-color:transparent;background:#eceef1}
.stepper .st.off .d::after{background:#8b8f98;width:8px;height:8px}
.stepper .ln{flex:1;height:1px;background:var(--line)}
.stephead{font-size:10.5px;color:var(--faint);margin-bottom:6px}
.fcard h3{margin:0 0 8px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.fcard .desc{font-size:13px;color:var(--ink2);margin-bottom:16px}
.fld{margin-bottom:16px}
.foot{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;margin-top:14px}
.foot .sp{flex:1}
.foot .draft{font-size:12.5px;color:var(--mute)}

/* skip banner + upload */
.banner{display:flex;align-items:center;gap:14px;background:#f1f1f2;border:1px solid #e3e4e7;border-radius:16px;padding:12px 16px}
.banner .ic{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.banner .t{flex:1}
.banner .t b{display:block;font-size:14px;font-weight:600}
.banner .t span{font-size:12.5px;color:var(--ink2)}
.ucard{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#fff;position:relative;overflow:hidden}
.ucard .lead{font-size:13.5px;color:var(--ink2);margin-bottom:12px}
.drop{border:1.5px dashed #c9ccd2;border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--ink2);cursor:pointer;background:#fff}
.drop.has{display:flex;align-items:center;gap:10px;text-align:left;border-style:solid;border-color:var(--line)}
.drop .pdf{width:22px;height:26px;border-radius:3px;background:var(--red-bg);color:var(--red);font:600 8px 'Geist Mono',monospace;display:flex;align-items:center;justify-content:center}
.ucard .acts{display:flex;align-items:center;gap:10px;margin-top:12px}
.rd{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rd .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:4px}
.rd .h .ico{color:#8b5cf6}
.rd .h .sp{flex:1}
.rd .h .tm{font-size:11px;color:var(--faint);font-family:'Geist Mono',monospace;font-weight:400}
.rd .ln{display:flex;align-items:flex-start;gap:8px;color:var(--ink2)}
.rd .ln .ico{margin-top:2px}
.rd .ln.ok .ico{color:var(--green)}
.rd .ln.run .ico{color:#8b5cf6;animation:spin 1s linear infinite}
.rd .ln.wait{color:var(--faint)}
.rd .ln small{display:block;font-size:12px;color:var(--mute)}
.rd .ln.run b{font-weight:600}
.pbar{height:3px;border-radius:2px;background:#eef0f2;margin:8px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#d946ef,#f472b6);animation:fillbar 3.2s cubic-bezier(.3,.7,.4,1) forwards}
.ucard .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 80% at 50% 50%,rgba(168,85,247,.09),transparent 70%)}
.rd .note{font-size:12.5px;color:var(--mute)}
.res .h{display:flex;align-items:center;gap:12px;font-size:13.5px}
.res .h .chk{width:30px;height:30px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.res .h .sp{flex:1}
.abox{border:1px solid #f1d7b6;background:#fffaf2;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:12.5px}
.abox .k{font-size:10.5px;color:#a16207;margin-bottom:8px}
.abox .it{margin-bottom:8px}
.abox .it:last-child{margin-bottom:0}
.abox .it span{display:block;color:var(--ink2)}
.abox .it b{display:block;font-size:13.5px;font-weight:600}
.abox .it small{display:block;font-size:11.5px;color:var(--mute)}
.abox .it.row{display:flex;align-items:center;gap:12px}
.abox .it.row .t{flex:1}
.ledger{font-size:12.5px;color:var(--mute);margin-top:10px}
.still{margin-top:10px;font-size:13px}
.still .k{font-size:10.5px;color:var(--faint);margin:10px 0 4px}

/* payment */
.pm{border:1.5px solid var(--ink);border-radius:14px;padding:18px 18px 16px;margin-top:14px;position:relative}
.pm .hd{display:flex;align-items:center;margin-bottom:14px}
.pm .hd .tag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500}
.pm .hd .sp{flex:1}
.pm .hd .ico{color:var(--mute);cursor:pointer}
.pm hr{border:0;border-top:1.5px solid var(--ink);margin:16px 0}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;margin-bottom:14px}
.chk .b{width:18px;height:18px;border-radius:5px;border:1.5px solid #c4c7ce;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on .b{background:var(--navy);border-color:var(--navy);color:#fff}
.pm-empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;margin-top:14px;font-size:13px;color:var(--ink2)}
.pm-empty b{display:block;font-size:13.5px;margin:6px 0 4px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-h h4{margin:0;font-size:16px;font-weight:600;flex:1}

/* modal */
.ov{position:absolute;inset:0;background:rgba(20,22,28,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:30}
.modal{background:#fff;border-radius:14px;width:560px;padding:30px 34px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.msteps{display:flex;align-items:flex-start;justify-content:center;gap:0;margin-bottom:22px}
.msteps .s{width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;position:relative}
.msteps .s .c{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#aab0ba;position:relative;z-index:1}
.msteps .s.ok .c{background:var(--green);color:#fff}
.msteps .s.ok{color:var(--green-tx)}
.msteps .s.run .c{background:#5b5e66;color:#fff}
.msteps .s.run{font-weight:600}

/* find a click target by its visible text (startsWith; "=" prefix = exact). Inputs match on aria-label. */
const demoFind = ([label, side, n = 0], allowBar = false) => {
  const exact = label[0] === '=', want = (exact ? label.slice(1) : label).toLowerCase();
  let c = [...document.querySelectorAll('button,a,span,div,label,input')].filter(el => {
    if (!allowBar && el.closest('#presenter')) return false;
    const isInput = el.tagName === 'INPUT';
    const t = (isInput ? (el.getAttribute('aria-label') || el.placeholder || '') : (el.textContent || '')).trim().replace(/\s+/g, ' ').toLowerCase();
    if (exact ? t !== want : !t.startsWith(want)) return false;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return false;
    const cur = getComputedStyle(el).cursor;
    return isInput ? cur === 'text' || cur === 'auto' || cur === 'pointer' : cur === 'pointer';
  });
  c = c.filter(el => !c.some(o => o !== el && el.contains(o)));
  return c.length ? c[n < 0 ? c.length + n : Math.min(n, c.length - 1)] : null;
};
